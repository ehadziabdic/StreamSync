name: Update Trakt Calendar

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch:    # Allows you to click "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Gives GitHub permission to save the .ics file back to your repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pytz icalendar python-dateutil

      - name: Run exporter
        working-directory: ./trakt-calender
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
        run: python traktCalendarExporter.py

      - name: Update Gist
        env:
          GIST_ID: 1a6b5f08c59721e6d11f2d3f43cba970 # <--- Paste your Gist ID code here
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }} # <--- Ensure you have a Secret with your Token
        run: |
          # Read the file content and escape it for JSON
          CONTENT=$(cat trakt-calender/trakt.ics | jq -Rs .)
          
          # Send to Gist via API
          curl -L -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -d "{\"files\":{\"trakt.ics\":{\"content\":$CONTENT}}}" \
            "https://api.github.com/gists/$GIST_ID"