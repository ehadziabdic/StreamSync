name: Update Trakt Calendar

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pytz icalendar python-dateutil typing_extensions

      - name: Run exporter
        working-directory: ./trakt-calender
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: python traktCalendarExporter.py